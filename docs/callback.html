<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OAuth Callback - AppTiktok</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace; max-width: 640px; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.6; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  dt { font-weight: 600; margin-top: 1rem; }
  dd { margin: 0; word-break: break-all; background: #f4f4f4; padding: 0.5rem; border-radius: 4px; }
  .empty { color: #999; font-style: italic; }
</style>
</head>
<body>
<h1>OAuth callback received</h1>
<p>This is a local test-only page: it just reads the query string TikTok sent back and displays it, so it can be copied for the manual token exchange. Nothing is sent anywhere.</p>
<dl id="out"></dl>
<script>
  const params = new URLSearchParams(window.location.search);
  const out = document.getElementById('out');
  const keys = ['code', 'state', 'error', 'error_description', 'scopes'];
  let any = false;
  for (const k of keys) {
    if (params.has(k)) {
      any = true;
      const dt = document.createElement('dt');
      dt.textContent = k;
      const dd = document.createElement('dd');
      dd.textContent = params.get(k);
      out.appendChild(dt);
      out.appendChild(dd);
    }
  }
  if (!any) {
    out.innerHTML = '<p class="empty">No query params received yet.</p>';
  }
</script>
</body>
</html>
